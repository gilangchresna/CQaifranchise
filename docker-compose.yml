# ─────────────────────────────────────────────────────────────
# CyberQuote Local Development Stack
# PostgreSQL + Redis + Backend API
# ─────────────────────────────────────────────────────────────

services:
  # ── PostgreSQL Database ──────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: cyberquote-postgres
    restart: unless-stopped
    
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cyberquote}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cyberquote_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-cyberquote}
    
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cyberquote} -d ${POSTGRES_DB:-cyberquote}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    
    networks:
      - cyberquote-network

  # ── Redis Cache & Message Broker ────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: cyberquote-redis
    restart: unless-stopped
    
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
    
    ports:
      - "${REDIS_PORT:-6379}:6379"
    
    volumes:
      - redis_data:/data
    
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    
    networks:
      - cyberquote-network

  # ── Backend API (FastAPI) ───────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: development
    container_name: cyberquote-backend
    restart: unless-stopped
    
    environment:
      # Database
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cyberquote}:${POSTGRES_PASSWORD:-cyberquote_dev_password}@postgres:5432/${POSTGRES_DB:-cyberquote}
      DATABASE_POOL_SIZE: 5
      DATABASE_MAX_OVERFLOW: 10
      
      # Redis
      REDIS_URL: redis://redis:6379/0
      REDIS_CACHE_TTL: 3600
      
      # Celery
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      
      # Auth
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      JWT_ALGORITHM: HS256
      JWT_EXPIRATION_MINUTES: 60
      
      # External Services
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      
      # Server
      PORT: 8000
      CORS_ORIGINS: "http://localhost:3000,http://localhost:5173"
    
    ports:
      - "8000:8000"
    
    volumes:
      - ./backend:/app/backend:ro
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    
    networks:
      - cyberquote-network

  # ── Celery Worker (for background tasks) ────────────────────
  celery-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: development
    container_name: cyberquote-celery
    restart: unless-stopped
    
    command: celery -A backend.common.celery_app worker --loglevel=info --concurrency=4
    
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cyberquote}:${POSTGRES_PASSWORD:-cyberquote_dev_password}@postgres:5432/${POSTGRES_DB:-cyberquote}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    
    volumes:
      - ./backend:/app/backend:ro
      - ./uploads:/app/uploads
    
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    
    networks:
      - cyberquote-network

  # ── Celery Beat (scheduler) ─────────────────────────────────
  celery-beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: development
    container_name: cyberquote-celery-beat
    restart: unless-stopped
    
    command: celery -A backend.common.celery_app beat --loglevel=info
    
    environment:
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    
    volumes:
      - ./backend:/app/backend:ro
    
    depends_on:
      redis:
        condition: service_healthy
    
    networks:
      - cyberquote-network

# ── Volumes ───────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

# ── Networks ───────────────────────────────────────────────────
networks:
  cyberquote-network:
    driver: bridge
